# Unit tests on every push and pull request, and before each release (release.yml calls it).
# Readout.Core and its tests are plain net10.0, so they need no MAUI workload and run on Linux.
name: CI

on:
  push:
    # Branches only: a tag push runs release.yml, which runs these tests itself.
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to test. Empty: the one that triggered the run."
        type: string
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # TreatWarningsAsErrors is on for the core and tests, so this also fails on new
      # analyzer or style warnings.
      - name: Build
        run: dotnet build Readout.Tests --configuration Release

      - name: Test
        run: dotnet test --project Readout.Tests --configuration Release --no-build
