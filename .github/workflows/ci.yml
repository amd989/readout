# Unit tests on every push and pull request, and before each release (release.yml calls it),
# plus the Linux app's build. Readout.Core, its tests and the Linux head are plain net10.0, so
# they need no MAUI workload and run on Linux.
name: CI

on:
  push:
    # Branches only: a tag push runs release.yml, which runs these tests itself.
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to test. Empty: the one that triggered the run."
        type: string
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # TreatWarningsAsErrors is on for the core and tests, so this also fails on new
      # analyzer or style warnings.
      - name: Build
        run: dotnet build Readout.Tests --configuration Release

      # Coverage of Readout.Core and Readout.Mcp; the settings are in Readout.Tests/testconfig.json.
      - name: Test
        run: >
          dotnet test --project Readout.Tests --configuration Release --no-build
          --coverlet --results-directory TestResults/coverage

      - name: Coverage summary
        run: |
          python3 - TestResults/coverage/coverage.cobertura.*.xml >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          pct = lambda e, k: f"{100 * float(e.get(k)):.1f}%"
          print("## Code coverage\n\n| Project | Lines | Branches |\n|---|---|---|")
          for p in root.iter("package"):
              print(f"| {p.get('name')} | {pct(p, 'line-rate')} | {pct(p, 'branch-rate')} |")
          print(f"| **Total** | **{pct(root, 'line-rate')}** | **{pct(root, 'branch-rate')}** |")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/coverage/coverage.cobertura.*.xml

      # The Linux head is plain net10.0 on MAUI's GTK4 backend, so it builds here too.
      - name: Build Linux app
        run: dotnet build Readout.Linux --configuration Release
