; Readout bridge: an ESP32 wired to a chip's serial port that forwards its bytes over Bluetooth
; LE to the Readout app (and, for two-way chips, the app's bytes back). See README.md.
;
; Pick the build for your chip, board and wiring:
;
;   FS9721 meters (receive-only, through an optocoupler)
;   pio run -e fs9721-esp32dev -t upload       classic ESP32 (ESP-WROOM-32); TXD lights the LED (3 wires)
;   pio run -e fs9721-esp32dev-vdd -t upload   classic ESP32; VDD lights the LED (4 wires, least drain),
;                                              or TXD wired straight to the GPIO for a bench test
;   pio run -e fs9721-esp32c3 -t upload        ESP32-C3, TXD lights the LED
;   pio run -e fs9721-esp32c3-vdd -t upload    ESP32-C3, VDD lights the LED
;
;   DSO150 oscilloscope running DSOShell (two-way, wired directly)
;   pio run -e dso150-esp32dev -t upload       classic ESP32
;   pio run -e dso150-esp32c3 -t upload        ESP32-C3
;
;   pio device monitor                         what it forwards (115200 baud)
;
; SLEEP_AFTER_S=10 (in build_flags) sets the deep sleep after that many seconds without data;
; 0 never sleeps (the DSO150 builds' default).

[platformio]
default_envs = fs9721-esp32dev

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^1.4.3

; The boards.
[esp32dev]
board = esp32dev
build_flags =
    -D LED_PIN=2

[esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    -D LED_PIN=8
    -D LED_ACTIVE_LOW=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; FS9721: the meter's maker-chosen LCD symbols, bit 0 first (docs/FS9721.md). The Miyako 890G's.
; The input must be able to wake the chip from deep sleep: GPIO 33 on a classic ESP32, only
; GPIO 0–5 on a C3.
[fs9721]
build_flags =
    -D 'METER_SYMBOLS="°F,hFE,°C,"'

[fs9721-esp32dev]
build_flags = ${esp32dev.build_flags} ${fs9721.build_flags} -D UART_RX_PIN=33 -D UART_TX_PIN=17

[fs9721-esp32c3]
build_flags = ${esp32c3.build_flags} ${fs9721.build_flags} -D UART_RX_PIN=3 -D UART_TX_PIN=21

; TXD lights the LED: the phototransistor pulls the pin low while TXD is high, so the signal
; arrives inverted.
[env:fs9721-esp32dev]
board = ${esp32dev.board}
build_flags = ${fs9721-esp32dev.build_flags} -D UART_RX_INVERTED=1

[env:fs9721-esp32c3]
board = ${esp32c3.board}
build_flags = ${fs9721-esp32c3.build_flags} -D UART_RX_INVERTED=1

; VDD lights the LED through TXD (or TXD is wired straight to the pin): the signal arrives the
; right way up.
[env:fs9721-esp32dev-vdd]
board = ${esp32dev.board}
build_flags = ${fs9721-esp32dev.build_flags} -D UART_RX_INVERTED=0

[env:fs9721-esp32c3-vdd]
board = ${esp32c3.board}
build_flags = ${fs9721-esp32c3.build_flags} -D UART_RX_INVERTED=0

; DSO150: 115200 baud both ways, 3.3 V logic straight to the scope's PA9 (its TX) and PA10 (its
; RX). Twice NimBLE's default buffers, so a waveform's notifications can queue while the link
; catches up.
[dso150]
build_flags =
    -D CHIP_DSO150=1
    -D CONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24

[env:dso150-esp32dev]
board = ${esp32dev.board}
build_flags = ${esp32dev.build_flags} ${dso150.build_flags} -D UART_RX_PIN=16 -D UART_TX_PIN=17

[env:dso150-esp32c3]
board = ${esp32c3.board}
build_flags = ${esp32c3.build_flags} ${dso150.build_flags} -D UART_RX_PIN=20 -D UART_TX_PIN=21
