; Readout bridge for FS9721 meters: reads the meter chip's TXD and forwards the bytes over
; Bluetooth LE to the Readout app. See README.md for the wiring.
;
;   pio run -e esp32dev -t upload      build and flash a classic ESP32 dev board
;   pio device monitor                 watch the frames it forwards (115200 baud)

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    ; 1 when TXD drives an optocoupler (its output pulls the pin low while TXD is high).
    ; 0 when TXD is wired straight to the ESP32 (shared ground; bench tests only).
    -D METER_RX_INVERTED=1
    ; The meter's maker-chosen LCD symbols, bit 0 first (docs/FS9721.md). The Miyako 890G's.
    -D 'METER_SYMBOLS="°F,hFE,°C,"'

; Classic ESP32 dev boards (ESP32-WROOM-32 DevKit and the like).
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D METER_RX_PIN=16
    -D METER_TX_PIN=17
    -D LED_PIN=2

; ESP32-C3 boards (C3 SuperMini, C3 DevKitM): smaller and lighter on the battery.
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D METER_RX_PIN=20
    -D METER_TX_PIN=21
    -D LED_PIN=8
    -D LED_ACTIVE_LOW=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
