; Readout bridge for FS9721 meters: reads the meter chip's TXD and forwards the bytes over
; Bluetooth LE to the Readout app. See README.md for the wiring.
;
; Pick the target for your board and your optocoupler wiring:
;
;   pio run -e esp32dev -t upload       classic ESP32 (ESP-WROOM-32); TXD lights the LED (3 wires)
;   pio run -e esp32dev-vdd -t upload   classic ESP32; VDD lights the LED (4 wires, least drain),
;                                       or TXD wired straight to the GPIO for a bench test
;   pio run -e esp32c3 -t upload        ESP32-C3, TXD lights the LED
;   pio run -e esp32c3-vdd -t upload    ESP32-C3, VDD lights the LED
;   pio device monitor                  watch the frames it forwards (115200 baud)
;
; SLEEP_AFTER_S=10 (in build_flags) sets the deep sleep after that many seconds without data;
; 0 never sleeps.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    ; The meter's maker-chosen LCD symbols, bit 0 first (docs/FS9721.md). The Miyako 890G's.
    -D 'METER_SYMBOLS="°F,hFE,°C,"'

; Classic ESP32 boards. GPIO 33 can wake the chip from deep sleep.
[esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D METER_RX_PIN=33
    -D METER_TX_PIN=17
    -D LED_PIN=2

; ESP32-C3 boards (C3 SuperMini, C3 DevKitM). Only GPIO 0–5 can wake the chip from deep sleep.
[esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D METER_RX_PIN=3
    -D METER_TX_PIN=21
    -D LED_PIN=8
    -D LED_ACTIVE_LOW=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; TXD lights the LED: the phototransistor pulls the pin low while TXD is high, so the signal
; arrives inverted.
[env:esp32dev]
board = ${esp32dev.board}
build_flags = ${esp32dev.build_flags} -D METER_RX_INVERTED=1

[env:esp32c3]
board = ${esp32c3.board}
build_flags = ${esp32c3.build_flags} -D METER_RX_INVERTED=1

; VDD lights the LED through TXD (or TXD is wired straight to the pin): the signal arrives the
; right way up.
[env:esp32dev-vdd]
board = ${esp32dev.board}
build_flags = ${esp32dev.build_flags} -D METER_RX_INVERTED=0

[env:esp32c3-vdd]
board = ${esp32c3.board}
build_flags = ${esp32c3.build_flags} -D METER_RX_INVERTED=0
