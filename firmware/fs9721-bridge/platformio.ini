; Readout bridge for FS9721 meters: reads the meter chip's TXD and forwards the bytes over
; Bluetooth LE to the Readout app. See README.md for the wiring.
;
;   pio run -e esp32dev -t upload     build and flash a classic ESP32 (ESP-WROOM-32) board
;   pio run -e esp32c3 -t upload      an ESP32-C3 board
;   pio device monitor                watch the frames it forwards (115200 baud)
;
; Settings (add to an env's build_flags to change them):
;   METER_RX_INVERTED=1  for an optocoupler whose LED lights while TXD is high (the older
;                        wiring); the README's wiring and direct wiring need 0, the default.
;   SLEEP_AFTER_S=10     deep sleep after this many seconds without data; 0 never sleeps.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    ; The meter's maker-chosen LCD symbols, bit 0 first (docs/FS9721.md). The Miyako 890G's.
    -D 'METER_SYMBOLS="°F,hFE,°C,"'

; Classic ESP32 boards (ESP-WROOM-32 DevKit and the like). GPIO 33 can wake it from deep sleep.
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D METER_RX_PIN=33
    -D METER_TX_PIN=17
    -D LED_PIN=2

; ESP32-C3 boards (C3 SuperMini, C3 DevKitM). Only GPIO 0–5 can wake it from deep sleep.
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D METER_RX_PIN=3
    -D METER_TX_PIN=21
    -D LED_PIN=8
    -D LED_ACTIVE_LOW=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
